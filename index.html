<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тибе 💗</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: linear-gradient(135deg,#ffe4ef,#fff0f7,#ffd6e7);
  font-family: Arial,sans-serif; color: #d94e86;
  text-align: center; overflow-x: hidden;
}
.card {
  width: min(92%,440px); margin: 35px auto; padding: 24px 16px;
  background: #ffffffd9; border: 2px solid #ffb4d0;
  border-radius: 25px; box-shadow: 0 8px 30px #e9a4c055;
}
.scene {
  height: 180px; position: relative; overflow: hidden;
  border-radius: 18px; background: #fff0f6; margin: 20px 0;
}
.cat { position: absolute; top: 65px; font-size: 55px; line-height: 1.2; }
.cat1 { left: 5%; animation: runRight 2s ease-in-out infinite alternate; }
.cat2 { right: 5%; animation: runLeft 2s ease-in-out infinite alternate; }
@keyframes runRight {
  from { transform: translateX(0); }
  to { transform: translateX(85px); }
}
@keyframes runLeft {
  from { transform: translateX(0) scaleX(-1); }
  to { transform: translateX(-85px) scaleX(-1); }
}
.heart {
  position: absolute; left: 50%; top: 65px; font-size: 25px;
  animation: floatHeart 1.5s ease-in-out infinite;
}
@keyframes floatHeart {
  0%,100% { transform: translateY(15px) scale(.8); opacity: .4; }
  50% { transform: translateY(-15px) scale(1.2); opacity: 1; }
}
button {
  border: 0; border-radius: 12px; background: #ed76a5;
  color: white; padding: 13px 22px; margin: 7px;
  font-size: 16px; cursor: pointer;
}
#message { min-height: 25px; }
.small { font-size: 14px; color: #ba6389; }
</style>
</head>
<body>
<main class="card">
  <h2>Посмотри, кто прибежал 💗</h2>
  <p>Два маленьких котика для тебя</p>
  <div class="scene">
    <span class="cat cat1">🐈</span>
    <span class="cat cat2">🐈</span>
    <span class="heart">💕</span>
  </div>
  <h3 id="question">Ты меня любишь? 💖</h3>
  <p id="message">Выбирай 🥺</p>
  <button onclick="yes()">Да 💗</button>
  <button onclick="no()">Нет 🙈</button>
  <p class="small">Любимому 💌</p>
</main>
<script>
let step = 0;
function yes() {
    step++;

    const questions = [
    "Ты меня любишь? ❤️",
    "Правда-правда?",
    "Обнимать меня будешь?",
    "Обнимешь сильно-сильно? 🫂",
    "Будем всегда любить друг друга? 💗",
    "Ты счастлив со мной? ❤️",
    "И последний вопрос — ты точно не передумаешь? 💞"
];

  

const index = Math.min(step - 1, questions.length - 1);
document.getElementById("question").textContent = questions[index];
}
  let noCount = 0;

function no() {
    const replies = [
        "Может, подумаешь ещё раз? ❤️",
        "Не то",
        "Ну пожалуйста",
        "Я всё ещё жду твоего ответа ❤️"
    ];

    const index = Math.min(noCount, replies.length - 1);

    document.getElementById("question").textContent = replies[index];

    noCount++;
}
</script>
</body>
</html>
